<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collection Browser | The Joker's Wildcards</title>
    <link type="text/css" rel="stylesheet" href="cards.css">
</head>
<body>
    <div class="page-shell">
        <header class="hero">
            <div class="hero-back-link"><a class="action action-primary" href="/index.html">Back Home</a></div>
            <div class="page-header hero-banner">
                <img src="/assets/pc-header.png" alt="Cartoon style image that shows a nerd dressed as a jester holding a graded baseball card. Text reads: The Joker's Personal Collection">
            </div>
        </header>

        <section class="dashboard">
            <div class="panel" style="display: none;">
                <div class="stats">
                    <article class="stat"><span class="stat-value" id="stat-total">0</span><span class="stat-label">Cards</span></article>
                    <article class="stat"><span class="stat-value" id="stat-years">0</span><span class="stat-label">Years</span></article>
                    <article class="stat"><span class="stat-value" id="stat-fronts">0</span><span class="stat-label">Front images</span></article>
                    <article class="stat"><span class="stat-value" id="stat-backs">0</span><span class="stat-label">Back images</span></article>
                </div>
            </div>

            <div class="panel">
                <div class="toolbar">
                    <div class="field">
                        <label for="search-input">Search</label>
                        <input id="search-input" type="search" placeholder="Title, player, set, team, year...">
                    </div>

                    <div class="field">
                        <label for="sort-select">Sort</label>
                        <select id="sort-select">
                            <option value="newest">Newest first</option>
                            <option value="oldest">Oldest first</option>
                            <option value="title">Title A-Z</option>
                            <option value="player">Player A-Z</option>
                            <option value="brand">Brand A-Z</option>
                        </select>
                    </div>

                    <div class="toolbar-actions">
                        <button class="action action-secondary" id="clear-search" type="button">Clear</button>
                    </div>
                </div>
            </div>
        </section>

        <div id="status" class="status" style="display: none;">Loading cards from cards.csv...</div>
        <main id="gallery" class="collection-grid" aria-live="polite"></main>
        <div id="empty-state" class="empty-state" hidden>No cards match the current filters.</div>
    </div>

    <div id="image-modal" class="modal" aria-hidden="true">
        <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title">
            <div class="modal-head">
                <div>
                    <h2 id="modal-title" class="modal-title"></h2>
                    <p id="modal-caption" class="modal-caption"></p>
                </div>
                <button id="modal-close" class="modal-close" type="button" aria-label="Close full-size image">&times;</button>
            </div>

            <div class="modal-stage">
                <div class="modal-image-shell">
                    <img id="modal-image" src="" alt="">
                </div>

                <div class="modal-controls" id="modal-controls"></div>
            </div>
        </div>
    </div>

    <script src="cards-gallery.js"></script>
</body>
</html>
