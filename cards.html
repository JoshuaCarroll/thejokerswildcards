<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collection Browser | The Joker's Wildcards</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Space+Grotesk:wght@400;500;700&display=swap');

        :root {
            --bg: #07151b;
            --bg-2: #10262f;
            --panel: rgba(11, 24, 29, 0.72);
            --panel-strong: rgba(17, 34, 40, 0.9);
            --line: rgba(255, 255, 255, 0.12);
            --text: #f5efe4;
            --muted: #b7c0bf;
            --gold: #ffcc66;
            --gold-2: #ff9f1c;
            --shadow: rgba(0, 0, 0, 0.38);
            --card-surface: #f7f2e7;
            --card-ink: #1c1a17;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--text);
            font-family: "Space Grotesk", system-ui, sans-serif;
            background:
                radial-gradient(circle at 12% 12%, rgba(255, 204, 102, 0.18), transparent 30%),
                radial-gradient(circle at 88% 8%, rgba(72, 160, 181, 0.18), transparent 26%),
                radial-gradient(circle at 70% 90%, rgba(255, 159, 28, 0.1), transparent 30%),
                linear-gradient(145deg, var(--bg), var(--bg-2));
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 42px 42px;
            mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.7), transparent 92%);
        }

        .page-shell {
            position: relative;
            width: min(1440px, calc(100vw - 24px));
            margin: 0 auto;
            padding: 18px 0 32px;
        }

        .page-header {
            text-align: center;
        }

        .page-header img {
            width: clamp(300px, 90vw, 900px);
        }

        .hero {
            position: relative;
            display: grid;
            gap: 18px;
            padding: 24px;
            border: 1px solid var(--line);
            border-radius: 28px;
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0.02)),
                var(--panel);
            box-shadow: 0 24px 80px var(--shadow);
            backdrop-filter: blur(12px);
            overflow: hidden;
        }

        .hero::after {
            content: "";
            position: absolute;
            inset: auto -10% -60% auto;
            width: 320px;
            height: 320px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 204, 102, 0.3), transparent 68%);
            filter: blur(6px);
            pointer-events: none;
        }

        .eyebrow {
            display: inline-flex;
            width: fit-content;
            align-items: center;
            gap: 8px;
            padding: 7px 12px;
            border: 1px solid rgba(255, 204, 102, 0.28);
            border-radius: 999px;
            color: var(--gold);
            background: rgba(255, 204, 102, 0.08);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            font-size: 0.75rem;
        }

        .hero-grid {
            display: grid;
            grid-template-columns: minmax(0, 1.2fr) minmax(0, 0.8fr);
            gap: 20px;
            align-items: end;
        }

        .hero-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: flex-end;
        }

        .action {
            appearance: none;
            border: 1px solid transparent;
            border-radius: 999px;
            padding: 12px 16px;
            font: inherit;
            font-weight: 700;
            text-decoration: none;
            transition: transform 160ms ease, border-color 160ms ease, background 160ms ease, color 160ms ease;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 46px;
        }

        .action:hover {
            transform: translateY(-1px);
        }

        .action-primary {
            color: #1b1203;
            background: linear-gradient(135deg, var(--gold), var(--gold-2));
            box-shadow: 0 10px 30px rgba(255, 159, 28, 0.25);
        }

        .action-secondary {
            color: var(--text);
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.14);
        }

        .dashboard {
            display: grid;
            grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr);
            gap: 14px;
            margin-top: 18px;
        }

        .panel {
            padding: 18px;
            border: 1px solid var(--line);
            border-radius: 22px;
            background: var(--panel-strong);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 12px;
        }

        .stat {
            padding: 14px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .stat-value {
            display: block;
            color: var(--gold);
            font-family: "Fraunces", Georgia, serif;
            font-size: clamp(1.5rem, 2vw, 2.25rem);
            line-height: 1;
        }

        .stat-label {
            display: block;
            margin-top: 8px;
            color: var(--muted);
            font-size: 0.84rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .toolbar {
            display: grid;
            grid-template-columns: minmax(0, 1.8fr) minmax(160px, 0.7fr) auto;
            gap: 12px;
            align-items: end;
        }

        .field {
            display: grid;
            gap: 8px;
        }

        .field label {
            color: var(--muted);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .field input,
        .field select {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            color: var(--text);
            background: rgba(255, 255, 255, 0.05);
            font: inherit;
            outline: none;
        }

        .field input::placeholder {
            color: rgba(245, 239, 228, 0.45);
        }

        .field input:focus,
        .field select:focus {
            border-color: rgba(255, 204, 102, 0.5);
            box-shadow: 0 0 0 4px rgba(255, 204, 102, 0.12);
        }

        .toolbar-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .status {
            margin: 16px 0 0;
            padding: 12px 14px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.05);
            color: var(--muted);
        }

        .status.error {
            border-color: rgba(255, 126, 126, 0.45);
            background: rgba(160, 33, 33, 0.28);
            color: #ffd9d9;
        }

        .collection-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 16px;
            margin-top: 18px;
        }

        .collection-card {
            display: grid;
            gap: 14px;
            padding: 14px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.09);
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.03));
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.25);
            opacity: 0;
            transform: translateY(10px);
            animation: reveal 420ms ease forwards;
        }

        @keyframes reveal {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .collection-title {
            margin: 0;
            font-family: "Fraunces", Georgia, serif;
            font-size: 1.3rem;
            line-height: 1.15;
        }

        .collection-subtitle {
            margin: 7px 0 0;
            color: var(--muted);
            font-size: 0.94rem;
            line-height: 1.45;
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .chip {
            padding: 6px 10px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text);
            font-size: 0.77rem;
            letter-spacing: 0.02em;
        }

        .image-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .image-button {
            appearance: none;
            padding: 0;
            border: 0;
            background: transparent;
            text-align: left;
            cursor: zoom-in;
        }

        .image-frame,
        .image-missing {
            display: grid;
            overflow: hidden;
            border-radius: 18px;
            background: var(--card-surface);
            color: var(--card-ink);
            border: 1px solid rgba(0, 0, 0, 0.08);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7);
        }

        .image-frame {
            position: relative;
        }

        .image-frame::after {
            content: attr(data-side);
            position: absolute;
            top: 10px;
            left: 10px;
            padding: 5px 9px;
            border-radius: 999px;
            color: #fff7e8;
            background: rgba(17, 17, 17, 0.78);
            font-size: 0.72rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .image-frame img {
            display: block;
            width: 100%;
            aspect-ratio: 5 / 7;
            object-fit: cover;
            background: var(--card-surface);
        }

        .image-missing {
            place-items: center;
            aspect-ratio: 5 / 7;
            padding: 12px;
            color: rgba(28, 26, 23, 0.75);
            text-align: center;
            font-size: 0.86rem;
        }

        .card-footer {
            display: flex;
            gap: 10px;
            justify-content: space-between;
            align-items: center;
            color: var(--muted);
            font-size: 0.84rem;
        }

        .price {
            color: var(--gold);
            font-weight: 700;
        }

        .empty-state {
            margin-top: 18px;
            padding: 28px;
            border-radius: 24px;
            border: 1px dashed rgba(255, 255, 255, 0.16);
            background: rgba(255, 255, 255, 0.04);
            color: var(--muted);
        }

        .modal {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(3, 8, 10, 0.86);
            padding: 16px;
            z-index: 999;
        }

        .modal.open {
            display: flex;
        }

        .modal-dialog {
            position: relative;
            width: min(96vw, 1100px);
            max-height: 92vh;
            padding: 14px 14px 10px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            background: rgba(8, 19, 23, 0.96);
            box-shadow: 0 30px 90px rgba(0, 0, 0, 0.6);
        }

        .modal-head {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: center;
            margin-bottom: 12px;
        }

        .modal-title {
            margin: 0;
            font-family: "Fraunces", Georgia, serif;
            font-size: 1.1rem;
        }

        .modal-caption {
            margin: 4px 0 0;
            color: var(--muted);
            font-size: 0.9rem;
        }

        .modal-close {
            width: 42px;
            height: 42px;
            border: 0;
            border-radius: 50%;
            cursor: pointer;
            color: #211507;
            background: linear-gradient(135deg, var(--gold), var(--gold-2));
            font-size: 1.35rem;
            line-height: 1;
            flex: 0 0 auto;
        }

        .modal-stage {
            display: grid;
            gap: 10px;
        }

        .modal-image-shell {
            position: relative;
            display: grid;
            place-items: center;
            min-height: min(72vh, 740px);
            border-radius: 20px;
            overflow: hidden;
            background: radial-gradient(circle at center, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.02));
        }

        #modal-image {
            display: block;
            max-width: 100%;
            max-height: 72vh;
            object-fit: contain;
            cursor: pointer;
            background: #0a0a0a;
            border-radius: 16px;
            box-shadow: 0 16px 46px rgba(0, 0, 0, 0.45);
        }

        .modal-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .modal-pill {
            appearance: none;
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 999px;
            padding: 10px 14px;
            color: var(--text);
            background: rgba(255, 255, 255, 0.06);
            cursor: pointer;
            font: inherit;
        }

        .modal-pill.active {
            border-color: rgba(255, 204, 102, 0.5);
            color: #211507;
            background: linear-gradient(135deg, var(--gold), var(--gold-2));
        }

        body.modal-open {
            overflow: hidden;
        }

        @media (max-width: 980px) {
            .hero-grid,
            .dashboard,
            .toolbar {
                grid-template-columns: 1fr;
            }

            .hero-actions,
            .toolbar-actions {
                justify-content: flex-start;
            }

            .stats {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 640px) {
            .page-shell {
                width: min(100vw - 16px, 100vw);
                padding: 8px 0 20px;
            }

            .hero,
            .panel {
                border-radius: 20px;
            }

            .stats {
                grid-template-columns: 1fr 1fr;
            }

            .collection-grid {
                grid-template-columns: 1fr;
            }

            .image-grid {
                grid-template-columns: 1fr;
            }

            .modal-dialog {
                width: min(100vw - 16px, 100vw);
                padding: 12px;
            }

            .modal-image-shell {
                min-height: 52vh;
            }
        }

        .stats {
            display: none;
        }
    </style>
</head>
<body>
    <div class="page-shell">
        <header class="hero">
            <div class=""><a class="action action-primary" href="index.html">Back Home</a></div>
            <div class="page-header">
                <img src="assets/pc-header.png" alt="Cartoon style image that shows a nerd dressed as a jester holding a graded baseball card. Text reads: The Joker's Personal Collection">
            </div>
        </header>

        <section class="dashboard" aria-label="Collection controls and summary">
            <div class="panel">
                <div class="stats">
                    <article class="stat"><span class="stat-value" id="stat-total">0</span><span class="stat-label">Cards</span></article>
                    <article class="stat"><span class="stat-value" id="stat-years">0</span><span class="stat-label">Years</span></article>
                    <article class="stat"><span class="stat-value" id="stat-fronts">0</span><span class="stat-label">Front images</span></article>
                    <article class="stat"><span class="stat-value" id="stat-backs">0</span><span class="stat-label">Back images</span></article>
                </div>
            </div>

            <div class="panel">
                <div class="toolbar">
                    <div class="field">
                        <label for="search-input">Search</label>
                        <input id="search-input" type="search" placeholder="Title, player, set, team, year...">
                    </div>

                    <div class="field">
                        <label for="sort-select">Sort</label>
                        <select id="sort-select">
                            <option value="newest">Newest first</option>
                            <option value="oldest">Oldest first</option>
                            <option value="title">Title A-Z</option>
                            <option value="player">Player A-Z</option>
                            <option value="brand">Brand A-Z</option>
                        </select>
                    </div>

                    <div class="toolbar-actions">
                        <button class="action action-secondary" id="clear-search" type="button">Clear</button>
                    </div>
                </div>
            </div>
        </section>

        <div id="status" class="status">Loading cards from cards.csv...</div>
        <main id="gallery" class="collection-grid" aria-live="polite"></main>
        <div id="empty-state" class="empty-state" hidden>No cards match the current filters.</div>
    </div>

    <div id="image-modal" class="modal" aria-hidden="true">
        <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title">
            <div class="modal-head">
                <div>
                    <h2 id="modal-title" class="modal-title"></h2>
                    <p id="modal-caption" class="modal-caption"></p>
                </div>
                <button id="modal-close" class="modal-close" type="button" aria-label="Close full-size image">&times;</button>
            </div>

            <div class="modal-stage">
                <div class="modal-image-shell">
                    <img id="modal-image" src="" alt="">
                </div>

                <div class="modal-controls" id="modal-controls"></div>
            </div>
        </div>
    </div>

    <script src="assets/cards-gallery.js"></script>
</body>
</html>
