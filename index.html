<html>
    <head>
        <title>The Joker's Wildcards</title>
        <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
        <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
        <link rel="manifest" href="assets/site.webmanifest">
        <meta property="og:image" content="https://thejokerswildcards.com/preview.png" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Fleur+De+Leah&family=Henny+Penny&display=swap');

            body {
                color: #fff;
                background-image: url('assets/joker-bg.png');
                background-repeat: no-repeat;
                background-attachment: fixed;
                background-position-y: bottom;
                background-position-x: right;
                background-size: cover; 
                min-height: 100vh; 
                margin: 0; 
            }
            
            .page-title {
                display: flex;
                justify-content: center;
                align-items: center;
                width: 100hw;
            }

            h1 {
                font-family: "Henny Penny", system-ui;
                font-weight: bold;
                text-shadow: 2px 2px 8px #000000;
                font-size: clamp(1.8rem, 4vw + 1rem, 4.5rem);
                margin-bottom: 6vh;
            }

            h1 span {
                font-family: "Fleur De Leah", cursive;
                font-size: 1.4em;
            }

            .page-content {
                font-size: 1.3em;
                line-height: 1.2em;
                width: 65vw;
                justify-content: left;
                align-items: left;
                margin-left: 2vw;
            }

            .link-button {
                justify-content: center;
                align-items: center;
                text-align: center;
                margin-bottom: 6vh;
            }

            .link-button img {
                width: clamp(20rem, 30vw + 1rem, 530px);
                align-self: center;
            }

            .nav-links {
                margin: 12px 0 0 2vw;
            }

            .nav-links a {
                color: #ffd44d;
                font-size: 1.05em;
                text-shadow: 2px 2px 8px #000000;
            }

            @media (max-width: 760px) {
                body {
                    background-position-x: 65%;
                    text-align: center;
                }
            }

            @media (max-width: 480px) {
                body {
                    background-position-x: 65%;
                    text-align: center;
                }

                .page-content {
                    width: 100vw;
                    align-items: center;
                    margin-left: 0;
                }
                
                .link-button {
                    text-align: center;
                    margin-bottom: 2vh;
                }

                .link-button img {
                    width: 85vw;
                    height: auto;
                    align-self: center;                    
                }
            }
        </style>
    </head>
    <body>
        <div id="page-container">
            <div class="page-title">
                <h1>The <span>Joker's</span> Wildcards</h1>
            </div>
            <div class="page-content">
                <div class="link-button">                        
                    <a href="https://share.collx.app/TheJokersWildcards?sort=NEWEST_FIRST">
                        <img src="assets/cards-for-sale.png" alt="Cards for sale">
                    </a>
                </div>
                <div class="link-button">                        
                    <a href="cards.html">
                        <img src="assets/personal-collection.png" alt="Browse my personal collection">
                    </a>
                </div>
                <img height="100" src="https://storage.googleapis.com/cdp-batches-prod/47648-1235969/66253598-front.jpg">
            </div>
        </div>
    </body>
</html>
